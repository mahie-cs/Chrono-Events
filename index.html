<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Chrono Events</h1>
    </header>
    
    <main>
        <section id="upcoming-section">
            <h2>Upcoming Events</h2>
            <div id="upcoming-container" class="card-container"></div>
        </section>

         <section id="ongoing-section">
            <h2>Ongoing Events</h2>
            <div id="ongoing-container" class="card-container"></div>
        </section>
        
        <section id="past-section">
            <h2>Past Events</h2>
            <div id="past-container" class="card-container"></div>
        </section>
    </main>

    <footer>
        <p>Created by: MD. Montasir Rahman Mahie</p>
        <p>Created on: 21st August 2026</p>
        <p>All rights reserved</p>
        <p>Contact: <a href="mailto:mahie.edu@gmail.com">mahie.edu@gmail.com</a></p>
    </footer>

    <div id="modal-backdrop" class="hidden">
        <div id="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-date" class="highlight-text"></p>
            <p id="modal-details"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
